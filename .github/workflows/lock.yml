# B-46 phase 1: generate a multi-platform .terraform.lock.hcl in CI.
# Download the artifact, commit it, then apply phase 2 (see README Contributing).
name: lock

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  providers-lock:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same pin as fluong/fray action.yml (Setup Terraform). No terraform_version:
      # the Action also leaves it unset. required_version in infra/terraform.tf is >= 1.11.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Providers lock (multi-platform)
        run: |
          set -euo pipefail
          terraform -chdir=infra providers lock \
            -platform=linux_amd64 \
            -platform=linux_arm64 \
            -platform=darwin_amd64 \
            -platform=darwin_arm64 \
            -platform=windows_amd64

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terraform-lock
          path: infra/.terraform.lock.hcl
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true
