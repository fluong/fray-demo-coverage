name: fray

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: GitHub-hosted runner label (e.g. ubuntu-26.04, ubuntu-latest)
        required: false
        default: ubuntu-26.04
        type: string

permissions:
  id-token: write
  contents: read
  pull-requests: write
  security-events: write

jobs:
  guards:
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          ver=8.21.2
          archive="gitleaks_${ver}_linux_x64.tar.gz"
          curl -fsSL -o "/tmp/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/${archive}"
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  /tmp/${archive}" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin -f "/tmp/${archive}" gitleaks

      - name: gitleaks
        run: gitleaks detect --source . --log-opts='--all' --verbose --no-banner

      - name: Internal identifier denylist
        env:
          # Fail closed: missing/empty secret → script exits non-zero.
          # Patterns are not committed (same as fluong/fray).
          FRAY_DENYLIST: ${{ secrets.FRAY_DENYLIST }}
        run: |
          chmod +x scripts/check-internal-identifiers.sh
          ./scripts/check-internal-identifiers.sh

      - name: Public docs (companion-repo name / run.app)
        run: |
          chmod +x scripts/check-public-docs.sh
          ./scripts/check-public-docs.sh

  fray:
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}
    services:
      localstack:
        image: localstack/localstack:4.0
        ports:
          - 4566:4566
        env:
          SERVICES: sts
          DEBUG: "0"
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      TF_VAR_aws_access_key: test
      TF_VAR_aws_secret_key: test
      TF_VAR_aws_sts_endpoint: http://localhost:4566
      # lock file is generated by the lock workflow (B-46); CI must not change it
      TF_CLI_ARGS_init: -lockfile=readonly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: fray
        uses: fluong/fray@30d0dae1e0413e26a14092d3e7820ac94f8e985a # v0.35.0
        with:
          api-url: https://api.getfray.dev
          working-directory: infra
          config: fray.yaml
          redaction-key: ${{ secrets.FRAY_REDACTION_KEY }}
          show-payload: true

      - name: Upload plan JSON
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan-json
          path: ${{ runner.temp }}/fray-out/plan.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload fray-out artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fray-out
          path: |
            ${{ runner.temp }}/fray-out/payload.json
            ${{ runner.temp }}/fray-out/findings.json
            ${{ runner.temp }}/fray-out/findings.sarif
          if-no-files-found: warn
          retention-days: 14

      # Intentionally-open high findings (FR-034) must not fail this job for the
      # wrong reason: the Action gate (action.yml "Gate" step) blocks only *new*
      # high findings vs baseline. Default-branch scans set the baseline
      # (classifyBaseline: first scan → gateModeNone; later → gateModeDiff).
      # Push/workflow_dispatch therefore pass the gate once the planted highs
      # are on the merge baseline. Assert runs only on those events so a PR
      # cannot confuse gate vs coverage assert.
      - name: Assert expected findings
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          HAS_SARIF: ${{ steps.fray.outputs.has-sarif }}
          SARIF_FILE: ${{ steps.fray.outputs.sarif-file }}
          # Same key Fray used so DFD evidence can match HMAC'd addresses.
          FRAY_REDACTION_KEY: ${{ secrets.FRAY_REDACTION_KEY }}
        run: bash scripts/assert-findings.sh

  # Same infra as `fray`, under stack label `alt` (B-39): separate baseline,
  # PR comment marker, and Code Scanning category. Assert uses the Action's
  # sarif-file output (…/fray-out-alt/findings.sarif); assert-findings.sh
  # derives FRAY_OUT from that path for findings.json and payload.json.
  fray-alt:
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}
    services:
      localstack:
        image: localstack/localstack:4.0
        ports:
          - 4566:4566
        env:
          SERVICES: sts
          DEBUG: "0"
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      TF_VAR_aws_access_key: test
      TF_VAR_aws_secret_key: test
      TF_VAR_aws_sts_endpoint: http://localhost:4566
      # lock file is generated by the lock workflow (B-46); CI must not change it
      TF_CLI_ARGS_init: -lockfile=readonly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: fray
        uses: fluong/fray@30d0dae1e0413e26a14092d3e7820ac94f8e985a # v0.35.0
        with:
          api-url: https://api.getfray.dev
          working-directory: infra
          config: fray.yaml
          stack: alt
          redaction-key: ${{ secrets.FRAY_REDACTION_KEY }}
          show-payload: true

      - name: Upload plan JSON
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan-json-alt
          path: ${{ runner.temp }}/fray-out-alt/plan.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload fray-out artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fray-out-alt
          path: |
            ${{ runner.temp }}/fray-out-alt/payload.json
            ${{ runner.temp }}/fray-out-alt/findings.json
            ${{ runner.temp }}/fray-out-alt/findings.sarif
          if-no-files-found: warn
          retention-days: 14

      # Intentionally-open high findings (FR-034) must not fail this job for the
      # wrong reason: the Action gate (action.yml "Gate" step) blocks only *new*
      # high findings vs baseline. Default-branch scans set the baseline
      # (classifyBaseline: first scan → gateModeNone; later → gateModeDiff).
      # Push/workflow_dispatch therefore pass the gate once the planted highs
      # are on the merge baseline. Assert runs only on those events so a PR
      # cannot confuse gate vs coverage assert.
      - name: Assert expected findings
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          HAS_SARIF: ${{ steps.fray.outputs.has-sarif }}
          SARIF_FILE: ${{ steps.fray.outputs.sarif-file }}
          # Same key Fray used so DFD evidence can match HMAC'd addresses.
          FRAY_REDACTION_KEY: ${{ secrets.FRAY_REDACTION_KEY }}
        run: bash scripts/assert-findings.sh
